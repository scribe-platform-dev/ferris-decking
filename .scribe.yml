site: ferris-decking
environment: development
turnstileSiteKey: 0x4AAAAAAFz0-yL9s-mDkI8O
umamiWebsiteId: f9ccf4ad-15e2-484d-910a-92758af883eb
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
contactCollection: inquiries
collections:
  - name: inquiries
    label: Inquiries
    path: content/inquiries
    format: yaml
    form: true
    fields:
      - name: name
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: phone
        type: string
        label: Phone
      - name: service
        type: select
        label: What do you need?
        options:
          - Custom Deck
          - Composite Deck
          - Deck Restoration
          - Pergola & Structure
          - Not sure yet
      - name: message
        type: text
        required: true
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
        - name: open
          label: Open
          kind: needs-you
        - name: waiting
          label: Waiting on customer
          kind: waiting
        - name: done
          label: Done
          kind: closed
        - name: archived
          label: Archived
          kind: closed
          hidden: true
  - name: services
    label: Services
    description: The services shown on the Services page.
    path: content/services
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - summary
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: summary
        type: text
        label: Short summary
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: order
        type: number
        label: Display order
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: body
        type: rich-text
        label: Full description
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: projects
    label: Portfolio
    description: Completed projects shown on the Portfolio page.
    path: content/projects
    format: yaml-frontmatter
    view:
      primary: title
      sort: order
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: location
        type: string
        label: Town/area
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: projectType
        type: select
        label: Project type
        required: true
        hidden: false
        readonly: false
        isBody: false
        options:
          - Custom Deck
          - Composite Deck
          - Deck Restoration
          - Pergola & Structure
      - name: size
        type: string
        label: Size (e.g. 320 sq ft)
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: order
        type: number
        label: Display order
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: summary
        type: rich-text
        label: Project story
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
