site: ferris-decking
environment: development
turnstileSiteKey: 0x4AAAAAAFz0-yL9s-mDkI8O
umamiWebsiteId: f9ccf4ad-15e2-484d-910a-92758af883eb
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
contactCollection: inquiries
collections:
  - name: inquiries
    label: Inquiries
    path: content/inquiries
    format: yaml
    fields:
      - name: name
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: email
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: message
        type: text
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: true
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
          hidden: false
        - name: open
          label: Open
          kind: needs-you
          hidden: false
        - name: waiting
          label: Waiting on customer
          kind: waiting
          hidden: false
        - name: done
          label: Done
          kind: closed
          hidden: false
        - name: archived
          label: Archived
          kind: closed
          hidden: true
  - name: services
    label: Services
    description: The services shown on the Services page.
    path: content/services
    format: yaml-frontmatter
    view:
      primary: title
      fields:
        - title
        - summary
    fields:
      - name: title
        type: string
        required: true
      - name: summary
        type: text
        required: true
        label: Short summary
      - name: order
        type: number
        label: Display order
      - name: body
        type: rich-text
        isBody: true
        label: Full description
