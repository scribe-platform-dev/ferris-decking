    label: Inquiries
    path: content/inquiries
    format: yaml
    fields:
      - name: name
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: email
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: message
        type: text
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: true
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
          hidden: false
        - name: open
          label: Open
          kind: needs-you
          hidden: false
        - name: waiting
          label: Waiting on customer
          kind: waiting
          hidden: false
        - name: done
          label: Done
          kind: closed
          hidden: false
        - name: archived
          label: Archived
          kind: closed
          hidden: true
